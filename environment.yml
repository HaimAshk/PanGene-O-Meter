# PanGene-O-Meter environment (independent of PanX)
#   conda env create -f environment.yml && conda activate pangeneometer
name: pangeneometer
channels:
  - conda-forge
  - bioconda
dependencies:
  - perl
  - diamond=2.1.10   # the version used for the reference results; v2.1.24 crashes in recluster, v2.1.25 has no recluster
  - pyrodigal
  - gzip            # large DIAMOND files are compressed after use
  # PanX and Panaroo are NOT part of this environment (install them separately, see the protocols)